<!doctype html>
<meta charset="utf-8">
<title>Meta Ads Campaign Structure — Thumbnail</title>
<style>
/* Inter, not Poppins — his type is a neutral grotesque, not a geometric */
@font-face{font-family:Grot;src:url(assets/fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:block}
@font-face{font-family:Grot;src:url(assets/fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:block}
@font-face{font-family:Scribble;src:url(assets/fonts/caveat-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:block}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0b0d}

:root{
  --meta:#0081fb;
  --rim:#38b6ff;
  --red:#ff2d3f;
  --card:#f7f8fa;
  --ink:#14161a;
}

#board{
  position:relative;width:1280px;height:720px;overflow:hidden;
  background:#0d0f12;
  font-family:Grot,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* his own room, blurred into a real depth-of-field plate */
#bg{position:absolute;inset:0;background:url(assets/bg-room.jpg) center/cover no-repeat;z-index:0}
#bg::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(8,10,13,.90) 0%,rgba(8,10,13,.70) 40%,rgba(8,10,13,.22) 70%,rgba(8,10,13,.50) 100%),
    radial-gradient(120% 100% at 50% 50%,transparent 40%,rgba(4,5,7,.72) 100%);
}
.abs{position:absolute}

/* ── presenter, with the cyan rim he puts on every cutout ── */
#face{right:-20px;top:33px;width:615px;z-index:4}
#face img{
  width:100%;height:auto;display:block;
  transform:scaleX(var(--fflip,1));
  filter:
    drop-shadow(-4px 0 0 var(--rim))
    drop-shadow(-7px 0 0 rgba(56,182,255,.5))
    drop-shadow(-14px 0 22px rgba(56,182,255,.4))
    drop-shadow(3px 0 0 rgba(255,255,255,.35))
    drop-shadow(-26px 22px 40px rgba(0,0,0,.66));
}

/* ── Meta Ads lockup ── */
#brand{left:64px;top:52px;display:flex;align-items:center;gap:14px;z-index:6}
#brand .m{width:66px;height:66px;color:var(--meta);filter:drop-shadow(0 0 18px rgba(0,129,251,.55))}
#brand .m svg{width:100%;height:100%;fill:currentColor;display:block}
#brand .t{font-weight:700;font-size:29px;letter-spacing:-.02em;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.7)}

/* ── the two widget cards ── */
.card{
  background:var(--card);border-radius:22px;padding:18px 22px 20px;
  box-shadow:0 20px 44px rgba(0,0,0,.58),0 2px 0 rgba(255,255,255,.5) inset;
  width:404px;
}
.card .lab{font-weight:600;font-size:16px;letter-spacing:.02em;color:#767b85}
.card .val{font-weight:700;font-size:74px;letter-spacing:-.05em;line-height:.96;
  color:var(--ink);margin-top:2px}
.card .unit{font-weight:600;font-size:20px;letter-spacing:-.01em;color:#767b85;margin-top:4px}
.card .strike{position:absolute;left:16px;top:78px;width:132px;height:9px;
  background:var(--red);border-radius:5px;transform:rotate(-4deg);
  box-shadow:0 2px 10px rgba(255,45,63,.55)}
.card .tag{position:absolute;right:20px;top:22px;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#fff}
.card.bad .tag{background:var(--red);box-shadow:0 6px 16px rgba(255,45,63,.5)}
.card.good{border-bottom:5px solid var(--meta)}
.card.good .tag{background:var(--meta);box-shadow:0 6px 16px rgba(0,129,251,.5)}
.card.good .val{color:var(--meta)}

/* ── headline ── */
#line{left:64px;bottom:58px;z-index:6;font-weight:700;font-size:62px;
  letter-spacing:-.035em;line-height:.98;color:#fff;
  text-shadow:0 4px 22px rgba(0,0,0,.85),0 1px 3px rgba(0,0,0,.9)}

/* ── red handwritten annotation, the way he marks up a thumbnail ── */
#note{z-index:7;font-family:Scribble,cursive;font-weight:700;font-size:32px;line-height:1.02;
  color:var(--red);transform:rotate(-5deg);
  text-shadow:0 2px 10px rgba(0,0,0,.7)}
</style>

<div id="board">
  <div id="bg"></div>

  <div class="abs" id="face" style="--fflip:1">
    <img src="assets/face-graded.png" alt="">
  </div>

  <div class="abs" id="brand">
    <span class="m"><svg viewBox="0 0 24 24"><path d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.3l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.967-2.315-1.303-3.454-1.303zm10.16 2.053c1.147 0 2.188.758 2.992 1.999 1.132 1.748 1.647 4.195 1.647 6.4 0 1.548-.368 2.9-1.839 2.9-.58 0-1.027-.23-1.664-1.004-.496-.601-1.343-1.878-2.832-4.358l-.617-1.028a44.908 44.908 0 0 0-1.255-1.98c.07-.109.141-.224.211-.327 1.12-1.667 2.118-2.602 3.358-2.602zm-10.201.553c1.265 0 2.058.791 2.675 1.446.307.327.737.871 1.234 1.579l-1.02 1.566c-.757 1.163-1.882 3.017-2.837 4.338-1.191 1.649-1.81 1.817-2.486 1.817-.524 0-1.038-.237-1.383-.794-.263-.426-.464-1.13-.464-2.046 0-2.221.63-4.535 1.66-6.088.454-.687.964-1.226 1.533-1.533a2.264 2.264 0 0 1 1.088-.285z"/></svg></span>
    <span class="t">Meta Ads</span>
  </div>

  <div class="abs card bad" style="left:64px;top:140px;z-index:5">
    <div class="tag">&#10005;</div>
    <div class="lab">what most people run</div>
    <div class="val">30</div>
    <div class="unit">ads per ad set</div>
    <div class="strike"></div>
  </div>

  <div class="abs card good" style="left:64px;top:348px;z-index:5">
    <div class="tag">&#10003;</div>
    <div class="lab">what actually earns spend</div>
    <div class="val">5&ndash;8</div>
    <div class="unit">ads per ad set</div>
  </div>

  <div class="abs" id="note" style="left:496px;top:238px">spend is<br>earned</div>

  <div class="abs" id="line">It&rsquo;s not<br>ad fatigue.</div>
</div>
