<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TOF feeds the pool BOF scales on</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="jobs" style="height:400px">

    <div class="jobs__ad" style="left:43px; top:150px; width:110px; height:110px; font-size:21px">TOF ad</div>

    <p class="seq__stage" style="left:168px; top:246px; width:210px; text-align:center">gets people into the funnel</p>

    <!-- The pool is drawn with more room than it has people in it. The gap
         above the level line is the headroom BOF spends into. -->
    <p class="seq__stage" style="left:393px; top:52px; width:400px; text-align:center">pool of more aware people</p>

    <div class="pool" style="left:393px; top:90px; width:400px; height:230px">
      <p class="pool__head">&#8593; keeps growing</p>
      <div class="pool__level" style="top:116px"></div>
      <div class="dots dots--filled" style="--cols:11; --dot:14px; --dot-gap:18px; margin:0">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>

    <div class="jobs__ad" style="left:1033px; top:150px; width:110px; height:110px; font-size:21px">BOF ad</div>

    <p class="seq__stage" style="left:978px; top:276px; width:220px; text-align:center">room to scale, Meta can spend more</p>

    <svg class="jobs__links" viewBox="0 0 1240 400" fill="none" aria-hidden="true">
      <defs>
        <marker id="fd" viewBox="0 0 10 10" refX="7" refY="5"
                markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0.5 0.5 L9 5 L0.5 9.5" fill="none" stroke="#0071E3"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>
      <g stroke="#0071E3" stroke-width="3" stroke-linecap="round" marker-end="url(#fd)">
        <path d="M168 205 L 378 205"/>
        <path d="M808 205 L 1018 205"/>
      </g>
    </svg>

  </div>

</section>

</body>
</html>
