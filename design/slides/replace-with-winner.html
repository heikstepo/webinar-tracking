<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replacing weak point with winner</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--top slide--mid">

  <h2 class="h3" style="margin-top:10px">Replacing weak point with winner</h2>

  <div class="nest" style="--nest-w:820px; --nest-pad:30px; margin-top:96px">
    <p class="nest__label">1 CBO campaign</p>

    <div class="nest__inner">
      <p class="nest__label" style="margin-bottom:0">1 new control ad set</p>
      <div class="dots" style="--cols:4; --dot:80px; --dot-gap:26px">
          <span class="dot" style="background:#34A518; border:none; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; font-weight:600; letter-spacing:-0.004em">new</span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot dot--ghost"></span>
          <span class="dot dot--ghost"></span>
          <span class="dot dot--ghost"></span>
      </div>
      <p class="nest__caption">5&ndash;8 unique ads</p>
    </div>
  </div>

</section>

</body>
</html>
