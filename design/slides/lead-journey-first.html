<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map out Lead Journey</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <h2 class="h3" style="margin-bottom:84px">Map out Lead Journey</h2>

  <div class="jobs" style="height:200px">

    <svg class="jobs__links" viewBox="0 0 1240 200" fill="none" aria-hidden="true">
      <defs>
        <marker id="lj" viewBox="0 0 10 10" refX="7" refY="5"
                markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0.5 0.5 L9 5 L0.5 9.5" fill="none" stroke="#0071E3"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Drawn before the markers so it runs behind them; on top it cut
           straight through the ad numbers. -->
      <path d="M60 90 L 1103 90" stroke="#0071E3" stroke-width="3"
            stroke-linecap="round" marker-end="url(#lj)"/>
    </svg>

    <!-- The ads sit on the journey rather than beside it, and the tint deepens
         step by step toward the goal instead of sorting them into three named
         stages — the stage is a consequence of where an ad falls. -->
    <div class="jobs__ad" style="left:88px; top:58px; width:64px; height:64px; font-size:20px">1</div>
    <div class="jobs__ad" style="left:293px; top:58px; width:64px; height:64px; font-size:20px;
                                 background:#D3E4FB; border-color:#A9C8EC">2</div>
    <div class="jobs__ad" style="left:498px; top:58px; width:64px; height:64px; font-size:20px;
                                 background:#C2DCFA; border-color:#9AC4F5">3</div>
    <div class="jobs__ad" style="left:703px; top:58px; width:64px; height:64px; font-size:20px;
                                 background:#ADD0F7; border-color:#83B4F0">4</div>
    <div class="jobs__ad" style="left:908px; top:58px; width:64px; height:64px; font-size:20px;
                                 background:#9AC4F5; border-color:#6FA8EE">5</div>

    <div class="seq__conv" style="left:1115px; top:60px">&#10003;</div>

    <p class="seq__stage" style="left:25px;  top:138px; width:190px; text-align:center">Make aware of problem/opportunity</p>
    <p class="seq__stage" style="left:230px; top:138px; width:190px; text-align:center">Educate on solution</p>
    <p class="seq__stage" style="left:435px; top:138px; width:190px; text-align:center">DR straight offer</p>
    <p class="seq__stage" style="left:640px; top:138px; width:190px; text-align:center">Case study</p>
    <p class="seq__stage" style="left:845px; top:138px; width:190px; text-align:center">Objection handling</p>

    <p class="seq__conv-label" style="left:1065px; top:138px; width:160px">conversion goal</p>

  </div>

</section>

</body>
</html>
