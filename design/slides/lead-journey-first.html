<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map out Purchase Journey</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <h2 class="h3" style="margin-bottom:34px">Map out Purchase Journey</h2>

  <div class="jobs" style="height:300px">

    <svg class="jobs__links" viewBox="0 0 1240 300" fill="none" aria-hidden="true">
      <defs>
        <marker id="pj" viewBox="0 0 10 10" refX="7" refY="5"
                markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0.5 0.5 L9 5 L0.5 9.5" fill="none" stroke="#0071E3"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Drawn before the markers so it runs behind them; on top it cut
           straight through the ad numbers. -->
      <path d="M100 190 L 1052 190" stroke="#0071E3" stroke-width="3"
            stroke-linecap="round" marker-end="url(#pj)"/>
    </svg>

    <!-- Eight steps on one axis will not take eight labels in a row, so the
         labels alternate above and below the line. Each then has twice the
         room, and none of them touch. -->
    <div class="jobs__ad" style="left:116px; top:162px; width:56px; height:56px; font-size:19px">1</div>
    <div class="jobs__ad" style="left:234px; top:162px; width:56px; height:56px; font-size:19px;
                                 background:#DDEAFC; border-color:#B3CEF3">2</div>
    <div class="jobs__ad" style="left:352px; top:162px; width:56px; height:56px; font-size:19px;
                                 background:#D3E4FB; border-color:#A9C8EC">3</div>
    <div class="jobs__ad" style="left:470px; top:162px; width:56px; height:56px; font-size:19px;
                                 background:#CAE0FA; border-color:#9FC2E9">4</div>
    <div class="jobs__ad" style="left:588px; top:162px; width:56px; height:56px; font-size:19px;
                                 background:#C2DCFA; border-color:#9AC4F5">5</div>
    <div class="jobs__ad" style="left:706px; top:162px; width:56px; height:56px; font-size:19px;
                                 background:#B8D6F9; border-color:#90BCF2">6</div>
    <div class="jobs__ad" style="left:824px; top:162px; width:56px; height:56px; font-size:19px;
                                 background:#ADD0F7; border-color:#83B4F0">7</div>
    <div class="jobs__ad" style="left:942px; top:162px; width:56px; height:56px; font-size:19px;
                                 background:#9AC4F5; border-color:#6FA8EE">8</div>

    <div class="seq__conv" style="left:1064px; top:160px">&#10003;</div>

    <!-- Odd steps above the line, hanging from a common baseline. -->
    <p class="jobs__out" style="left:34px;  top:84px; width:220px; height:60px; text-align:center; justify-content:center; align-items:flex-end">Make aware of problem</p>
    <p class="jobs__out" style="left:270px; top:84px; width:220px; height:60px; text-align:center; justify-content:center; align-items:flex-end">Educate on solution</p>
    <p class="jobs__out" style="left:506px; top:84px; width:220px; height:60px; text-align:center; justify-content:center; align-items:flex-end">DR Static Video Ad</p>
    <p class="jobs__out" style="left:742px; top:84px; width:220px; height:60px; text-align:center; justify-content:center; align-items:flex-end">Objection Handling</p>
    <p class="seq__conv-label" style="left:944px; top:104px; width:300px">conversion goal</p>

    <!-- Even steps below it, starting from a common top edge. -->
    <p class="jobs__out" style="left:152px; top:230px; width:220px; height:60px; text-align:center; justify-content:center; align-items:flex-start">Make aware of opportunity</p>
    <p class="jobs__out" style="left:388px; top:230px; width:220px; height:60px; text-align:center; justify-content:center; align-items:flex-start">DR Straight offer</p>
    <p class="jobs__out" style="left:624px; top:230px; width:220px; height:60px; text-align:center; justify-content:center; align-items:flex-start">Case Study</p>
    <p class="jobs__out" style="left:890px; top:230px; width:160px; height:60px; text-align:center; justify-content:center; align-items:flex-start">[&hellip;]</p>

  </div>

</section>

</body>
</html>
