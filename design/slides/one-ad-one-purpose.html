<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One ad, one purpose</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="eyebrow" style="margin-bottom:60px">So the simple rule is:</div>

  <div class="jobs" style="height:340px">

    <!-- One, then one, then many. The rule's shape is the graphic: the count
         only opens up at the last step. -->
    <div class="jobs__ad" style="left:70px; top:95px; width:150px; height:150px; font-size:26px">1 Ad</div>

    <div class="jobs__sq" style="left:350px; top:130px; width:240px; height:80px;
                                 font-size:24px; background:var(--accent);
                                 border-color:var(--accent); color:#fff">1 purpose</div>

    <!-- Left unlabelled: the caption names them, and lettering them would
         imply the count is three rather than however many. -->
    <div class="jobs__sq" style="left:710px; top:24px"></div>
    <div class="jobs__sq" style="left:710px; top:130px"></div>
    <div class="jobs__sq" style="left:710px; top:236px"></div>

    <p class="jobs__out" style="left:850px; top:24px; height:292px; width:340px; font-size:22px">
      <span>multiple concepts/creative variations serving that purpose</span></p>

    <svg class="jobs__links" viewBox="0 0 1240 340" fill="none" aria-hidden="true">
      <defs>
        <marker id="rule" viewBox="0 0 10 10" refX="7" refY="5"
                markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0.5 0.5 L9 5 L0.5 9.5" fill="none" stroke="#0071E3"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>
      <g stroke="#0071E3" stroke-width="3" stroke-linecap="round" marker-end="url(#rule)">
        <path d="M238 170 L 332 170"/>
        <path d="M604 152 C 650 132, 658 64, 692 64"/>
        <path d="M608 170 L 692 170"/>
        <path d="M604 188 C 650 208, 658 276, 692 276"/>
      </g>
    </svg>

  </div>

</section>

</body>
</html>
