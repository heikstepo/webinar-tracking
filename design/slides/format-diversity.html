<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Format diversity</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="eyebrow" style="margin-bottom:56px">And the way you reach format diversity is:</div>

  <div class="formats" style="width:100%">

    <div class="formats__card">
      <p class="formats__tag">TOF ad 1</p>
      <div class="formats__art">
        <!-- A frame with someone in it and a mic beside them. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="4" width="19" height="14" rx="2.5"/>
          <circle cx="10.2" cy="9.4" r="2.1"/>
          <path d="M6.6 14.6c0-2 1.6-3.2 3.6-3.2s3.6 1.2 3.6 3.2"/>
          <rect x="16.5" y="7.4" width="2.6" height="5" rx="1.3"/>
          <path d="M15.4 11.6a2.4 2.4 0 0 0 4.8 0M17.8 14v1.5"/>
        </svg>
      </div>
      <p class="formats__name">podcast style talking head</p>
    </div>

    <div class="formats__card">
      <p class="formats__tag">TOF ad 2</p>
      <div class="formats__art">
        <!-- Boxes wired together: a board being broken down. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="3.5" width="7" height="5" rx="1.2"/>
          <rect x="15" y="3.5" width="7" height="5" rx="1.2"/>
          <rect x="8.5" y="15.5" width="7" height="5" rx="1.2"/>
          <path d="M5.5 8.5v3.5h13V8.5M12 12v3.5"/>
        </svg>
      </div>
      <p class="formats__name">miro board breakdown</p>
    </div>

    <div class="formats__card">
      <p class="formats__tag formats__tag--mid">MOF ad 3</p>
      <div class="formats__art">
        <!-- The same board, but standing on legs. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="3" width="19" height="13" rx="1.5"/>
          <path d="M6.5 7h7M6.5 10h11M6.5 12.8h5"/>
          <path d="M8.4 16v4.6M15.6 16v4.6"/>
        </svg>
      </div>
      <p class="formats__name">physical whiteboard</p>
    </div>

    <div class="formats__card">
      <p class="formats__tag formats__tag--deep">BOF ad 4</p>
      <div class="formats__art">
        <!-- One still image and a couple of lines: nothing moves. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="2.5" width="17" height="19" rx="2"/>
          <rect x="6.5" y="5.5" width="11" height="6.5" rx="1.2" fill="#D7E7FA" stroke="none"/>
          <path d="M6.5 15.2h11M6.5 18.2h6.5"/>
        </svg>
      </div>
      <p class="formats__name">straight offer static ad</p>
    </div>

    <div class="formats__card">
      <p class="formats__tag formats__tag--deep">BOF ad 5</p>
      <div class="formats__art">
        <!-- The first frame again, with a button under it instead of a mic. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="2.5" width="19" height="13" rx="2.5"/>
          <circle cx="12" cy="7.6" r="2.2"/>
          <path d="M7.9 12.8c0-2.1 1.8-3.4 4.1-3.4s4.1 1.3 4.1 3.4"/>
          <rect x="6.4" y="18" width="11.2" height="3.6" rx="1.8"/>
        </svg>
      </div>
      <p class="formats__name">talking head straight offer</p>
    </div>

  </div>

</section>

</body>
</html>
