<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One job per ad</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="jobs">

    <!-- Left: three creatives, one job. One tint, repeated. -->
    <div class="jobs__mark jobs__mark--yes" style="left:270px; top:0">&#10003;</div>

    <div class="jobs__ad" style="left:82px; top:187px">1 Ad</div>

    <div class="jobs__sq" style="left:402px; top:96px">TOFU</div>
    <div class="jobs__sq" style="left:402px; top:214px">TOFU</div>
    <div class="jobs__sq" style="left:402px; top:332px">TOFU</div>

    <!-- Right: the same ad, three different jobs. The tints ladder down the
         funnel, which is exactly the thing that shouldn't be happening
         inside one ad. -->
    <div class="jobs__mark jobs__mark--no" style="left:910px; top:0">&#10005;</div>

    <div class="jobs__ad" style="left:722px; top:187px">1 Ad</div>

    <div class="jobs__sq" style="left:1042px; top:96px">TOFU</div>
    <div class="jobs__sq jobs__sq--mid" style="left:1042px; top:214px">MOFU</div>
    <div class="jobs__sq jobs__sq--deep" style="left:1042px; top:332px">BOFU</div>

    <svg class="jobs__links" viewBox="0 0 1240 430" fill="none" aria-hidden="true">
      <g stroke="#BFD6F7" stroke-width="2.5" stroke-linecap="round">
        <path d="M222 224 C 300 200, 330 144, 398 144"/>
        <path d="M232 262 L 398 262"/>
        <path d="M222 300 C 300 324, 330 380, 398 380"/>

        <path d="M862 224 C 940 200, 970 144, 1038 144"/>
        <path d="M872 262 L 1038 262"/>
        <path d="M862 300 C 940 324, 970 380, 1038 380"/>
      </g>
    </svg>

  </div>

</section>

</body>
</html>
