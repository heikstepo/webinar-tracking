<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The 5 Levels of Customer Awareness</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <h2 class="h3" style="margin-bottom:56px">The 5 Levels of Customer Awareness</h2>

  <!-- Turned over, so the widest, coldest level is at the top and the run
       reads downward toward the conversion the way every other funnel in the
       deck does. -->
  <div class="pyramid" style="--pw:900px; --pbh:78px">
    <div class="pyramid__band pyramid__band--1">Unaware</div>
    <div class="pyramid__band pyramid__band--2">Problem Aware</div>
    <div class="pyramid__band pyramid__band--3">Solution Aware</div>
    <div class="pyramid__band pyramid__band--4">Product Aware</div>
    <div class="pyramid__band pyramid__band--5">Most Aware</div>
  </div>

</section>

</body>
</html>
