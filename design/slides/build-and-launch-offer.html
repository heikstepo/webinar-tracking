<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>We'll build and launch your ads funnel in 14 days</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <!-- Two claims, one emphasis. The house voice dropped the highlighter wash a
       while back — emphasis here is a single thin rule, and the line break at
       the dash does the work a second colour would otherwise be doing.

       Sized so each clause holds one full line: at 50px the longer of the two
       measures 1193px against a 1240px column, and 52px wraps it. That matters
       more than it looks — a rule that breaks over two lines reads as two
       underlines rather than one. -->
  <h2 class="h2" style="font-size:50px; line-height:1.46; max-width:1240px">
    We&rsquo;ll build and launch your ads funnel in 14 days &mdash;<br>
    You only pay us <span class="mark--rule">from the revenue we generate</span>.
  </h2>

</section>

</body>
</html>
