<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Different motivations</title>
<link rel="stylesheet" href="../../4pi.css">
<link rel="stylesheet" href="../../voice-quiet.css">
<style>
/* ============================================================================
   A statement long enough to be read rather than taken in at a glance, so it
   is set at a readable size on a 1500px measure instead of at the size the
   short statements get.

   The second sentence is the one that asks for something, so it carries the
   weight and the accent; the first sets it up and sits a size down.

   Class names are prefixed stm with a local wrapper; voice-quiet.css owns
   .say and .says, which is why neither is reused here.
   ========================================================================= */
@page { size: 1920px 1080px; margin: 0; }

.slide { width: 1920px; height: 1080px; padding: 90px 110px; background: var(--ground); }

.stm { width: 1500px; text-align: center; }
.stm p { margin: 0; }

.stm__a {
  font-size: 46px; font-weight: 600; letter-spacing: -0.018em; line-height: 1.34;
  color: var(--ink-2);
}
.stm__b {
  margin-top: 40px !important;
  font-size: 56px; font-weight: 600; letter-spacing: -0.024em; line-height: 1.28;
  color: var(--ink);
}
.stm__b i { font-style: normal; color: var(--blue); }
</style>
</head>
<body>

<!-- no-autofit: its own canvas, not a panel. -->
<section class="slide slide--center slide--mid">
  <div class="stm">
    <p class="stm__a">Meta&rsquo;s AI is getting better at understanding not just who
      someone is, but what they&rsquo;re interested in, what they&rsquo;ve been engaging
      with, and how those interests change over time.</p>
    <p class="stm__b">That makes it increasingly important to create ads that speak to
      <i>different motivations</i> within your target audience.</p>
  </div>
</section>

</body>
</html>
