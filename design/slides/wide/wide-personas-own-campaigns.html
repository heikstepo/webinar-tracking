<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three personas, three campaigns</title>
<link rel="stylesheet" href="../../4pi.css">
<link rel="stylesheet" href="../../voice-quiet.css">
<style>
/* ============================================================================
   One persona, one campaign, three times over.

   Three separate lanes that never touch. The companion slide fans ten personas
   into a single box, and the whole difference between the two is that here the
   lines stay apart, so nothing crosses the gutter between rows and the arrows
   are straight rather than curved.

   The three figures are drawn differently (plain, long hair, hands on hips)
   because they are three different people, and identically sized because three
   heights read as a drafting slip rather than as three personas.

   No labels. Each row pairs its own two things, so naming them would only
   repeat what the layout already says.

   Class names are prefixed lane__; neither shared sheet uses them.
   ========================================================================= */
@page { size: 1920px 1080px; margin: 0; }

.slide { width: 1920px; height: 1080px; padding: 90px 110px; background: var(--ground); }

/* Narrower than the frame on purpose: at full width the arrows were a
   thousand pixels of empty rail, which says nothing. */
.lanes { width: 1380px; margin: 0 auto; }

.lane { display: flex; align-items: center; gap: 50px; }
.lane + .lane { margin-top: 60px; }

/* Solid ink, with real gaps left between the arms and the torso — overlapped,
   they merge into one lump and the silhouette stops reading as a figure. */
.lane__who { flex: none; width: 90px; display: flex; justify-content: center; }
.lane__who svg { display: block; fill: var(--ink); }

/* Drawn as a rail and a triangle rather than an SVG, so it stretches with the
   row without the arrowhead stretching too. */
.lane__arrow { position: relative; flex: 1; height: 3px; }
.lane__rail {
  position: absolute; left: 0; right: 34px; top: 0; height: 3px;
  background: #B6C2D0; border-radius: 2px;
}
.lane__tip {
  position: absolute; right: 0; top: -14px; width: 0; height: 0;
  border-left: 34px solid #B6C2D0;
  border-top: 15px solid transparent; border-bottom: 15px solid transparent;
}

/* ---- the campaigns ------------------------------------------------------- */
.lane__camp { flex: none; position: relative; }

/* Its name sits on the border, so the box needs no header row. */
.lane__box {
  border: 3px solid #C6CDD6; border-radius: 26px;
  padding: 52px 58px;
  display: flex; align-items: center; gap: 36px;
}
.lane__name {
  position: absolute; left: 48px; top: 0; transform: translateY(-50%);
  margin: 0; padding: 0 20px; background: var(--ground);
  font-size: 30px; font-weight: 600; letter-spacing: -0.008em; color: var(--ink-2);
}

.lane__box svg {
  display: block; width: 116px; height: 116px;
  fill: none; stroke: var(--blue); stroke-width: 3.4;
  stroke-linecap: round; stroke-linejoin: round;
}
.lane__box svg .fill { fill: var(--blue); stroke: none; }
</style>
</head>
