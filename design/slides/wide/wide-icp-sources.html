<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ICP</title>
<link rel="stylesheet" href="../../4pi.css">
<link rel="stylesheet" href="../../voice-quiet.css">
<style>
/* ============================================================================
   The word, then the three places. See build-icp-sources.py for why the marks
   are set in one ink rather than in brand colour.

   The marks are optically sized rather than boxed to a common width: Reddit is
   a circle, YouTube a wide rounded rectangle and Fathom a tall stack, so three
   equal boxes would leave YouTube looking twice the size of the others. Each is
   scaled until it carries the same weight on the page.
   ========================================================================= */
@page { size: 1920px 1080px; margin: 0; }

.slide { width: 1920px; height: 1080px; padding: 90px 120px; background: var(--ground); }

.icp { margin: 0 0 104px; font-size: 104px; font-weight: 600;
       letter-spacing: -0.02em; color: var(--ink); }

.srcs { display: flex; align-items: center; justify-content: center; gap: 140px; }

.src { display: flex; flex-direction: column; align-items: center; }
/* Fixed-height row for the marks. Without it each column is only as tall as
   its own logo, and since a circle, a wide rectangle and a tall stack are all
   different heights, the three captions end up on three different lines. */
.src__mark { height: 160px; display: flex; align-items: center; justify-content: center; }
.src svg { display: block; color: var(--ink); }
.src__name { margin: 28px 0 0; font-size: 30px; font-weight: 600;
             letter-spacing: -0.004em; color: var(--ink-2); }

/* Optical sizing, per mark. */
.src--fathom  svg { width: 150px; height: 150px; }
.src--reddit  svg { width: 138px; height: 138px; }
.src--youtube svg { width: 142px; height: 142px; }
</style>
</head>
<body>

<!-- no-autofit: sized for 1920 here, and its row is wider than
     the panel text column the fit pass would wrap it into. -->
<section class="slide slide--center slide--mid">

  <p class="icp">ICP</p>

  <div class="srcs">

</body>
</html>
