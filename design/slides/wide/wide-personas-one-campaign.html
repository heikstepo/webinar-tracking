<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Several personas, one campaign</title>
<link rel="stylesheet" href="../../4pi.css">
<link rel="stylesheet" href="../../voice-quiet.css">
<style>
/* ============================================================================
   Three personas, one campaign.

   The three figures are identical and the labels carry the difference. Drawing
   them at three slightly different heights read as a drafting slip rather than
   as three different people, which is a worse thing to say than nothing.

   The lines converge before they reach the box and enter it as one arrow. Three
   arrows arriving separately would say three campaigns in one frame; merging
   them first is the whole argument.

   The campaign is the same box the spend graphic uses: a border with its name
   sitting on it, ads inside. Two ads rather than three, so the set inside does
   not pair off one-to-one with the three personas outside.

   Class names are prefixed fan__; neither shared sheet uses them.
   ========================================================================= */
@page { size: 1920px 1080px; margin: 0; }

.slide { width: 1920px; height: 1080px; padding: 90px 110px; background: var(--ground); }

.fan { display: flex; align-items: center; justify-content: center; }

/* ---- the personas -------------------------------------------------------- */
.fan__who { flex: none; width: 300px; }

.per { display: flex; align-items: center; gap: 30px; height: 146px; }
.per + .per { margin-top: 80px; }

/* Solid ink, with real gaps left between the arms and the torso — overlapped,
   they merge into one lump and the silhouette stops reading as a figure. */
.per svg { display: block; flex: none; fill: var(--ink); }
.per__name {
  margin: 0;
  font-size: 36px; font-weight: 600; letter-spacing: -0.008em; color: var(--ink);
}

/* ---- the routing --------------------------------------------------------- */
.fan__lines { flex: none; }
.fan__lines svg {
  display: block; width: 480px; height: 598px;
  fill: none; stroke: #B6C2D0; stroke-width: 3.4;
  stroke-linecap: round; stroke-linejoin: round;
}
/* The open paths above would otherwise take the default fill and flood. */
.fan__lines svg .tip { fill: #B6C2D0; stroke: none; }

/* ---- the campaign -------------------------------------------------------- */
.fan__camp { flex: none; position: relative; }

/* Its name sits on the border, so the box needs no header row. */
.fan__box {
  border: 3px solid #C6CDD6; border-radius: 30px;
  padding: 62px 70px;
  display: flex; align-items: center; gap: 44px;
}
.fan__name {
  position: absolute; left: 60px; top: 0; transform: translateY(-50%);
  margin: 0; padding: 0 24px; background: var(--ground);
  font-size: 34px; font-weight: 600; letter-spacing: -0.008em; color: var(--ink-2);
}

.fan__box svg {
  display: block; width: 160px; height: 160px;
  fill: none; stroke: var(--blue); stroke-width: 3;
  stroke-linecap: round; stroke-linejoin: round;
}
.fan__box svg .fill { fill: var(--blue); stroke: none; }
</style>
</head>
<body>

<!-- no-autofit: its own canvas, not a panel. -->
<section class="slide slide--center slide--mid">

  <div class="fan">

    <div class="fan__who">

      <div class="per">
        <svg width="64" height="146" viewBox="0 0 66 150" aria-hidden="true">
          <circle cx="33" cy="16" r="14"/>
          <path d="M33 34 C 23 34, 17 41, 17 51 L 17 84 C 17 88, 21 90, 25 90
                   L 41 90 C 45 90, 49 88, 49 84 L 49 51 C 49 41, 43 34, 33 34 Z"/>
          <rect x="3"  y="46" width="11" height="44" rx="5.5"/>
          <rect x="52" y="46" width="11" height="44" rx="5.5"/>
          <rect x="19" y="88" width="12" height="58" rx="6"/>
          <rect x="35" y="88" width="12" height="58" rx="6"/>
        </svg>
        <p class="per__name">ICP 1</p>
      </div>

      <div class="per">
        <svg width="64" height="146" viewBox="0 0 66 150" aria-hidden="true">
          <circle cx="33" cy="16" r="14"/>
          <path d="M33 34 C 23 34, 17 41, 17 51 L 17 84 C 17 88, 21 90, 25 90
                   L 41 90 C 45 90, 49 88, 49 84 L 49 51 C 49 41, 43 34, 33 34 Z"/>
          <rect x="3"  y="46" width="11" height="44" rx="5.5"/>
          <rect x="52" y="46" width="11" height="44" rx="5.5"/>
          <rect x="19" y="88" width="12" height="58" rx="6"/>
          <rect x="35" y="88" width="12" height="58" rx="6"/>
        </svg>
        <p class="per__name">ICP 2</p>
      </div>

      <div class="per">
        <svg width="64" height="146" viewBox="0 0 66 150" aria-hidden="true">
          <circle cx="33" cy="16" r="14"/>
          <path d="M33 34 C 23 34, 17 41, 17 51 L 17 84 C 17 88, 21 90, 25 90
                   L 41 90 C 45 90, 49 88, 49 84 L 49 51 C 49 41, 43 34, 33 34 Z"/>
          <rect x="3"  y="46" width="11" height="44" rx="5.5"/>
          <rect x="52" y="46" width="11" height="44" rx="5.5"/>
          <rect x="19" y="88" width="12" height="58" rx="6"/>
          <rect x="35" y="88" width="12" height="58" rx="6"/>
        </svg>
        <p class="per__name">ICP 3</p>
      </div>

    </div>

    <div class="fan__lines">
      <svg viewBox="0 0 480 598" aria-hidden="true">
        <path d="M10 73  C 190 73,  210 299, 400 299"/>
        <path d="M10 299 H 400"/>
        <path d="M10 525 C 190 525, 210 299, 400 299"/>
        <path d="M400 299 H 440"/>
        <path class="tip" d="M440 283 L 476 299 L 440 315 Z"/>
      </svg>
    </div>

    <div class="fan__camp">
      <p class="fan__name">Campaign</p>
      <div class="fan__box">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="fill" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="fill" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>
    </div>

  </div>

</section>

</body>
</html>
