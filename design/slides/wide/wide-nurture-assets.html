<!doctype html>

<style>
/* ============================================================================
   See build-nurture-assets.py. Three drawn icons and two real brand marks, all
   in one ink so the set reads as one family.
   ========================================================================= */
@page { size: 1920px 1080px; margin: 0; }

.slide { width: 1920px; height: 1080px; padding: 90px 110px; background: var(--ground); }

/* Wrapping flex rather than a grid: five cells leave a short last row, and a
   grid packs that row against the left where this centres it under the rest.
   The container is sized to exactly 3 cells so it still wraps where it did. */
.grid {
  display: flex; flex-wrap: wrap; justify-content: center;
  column-gap: 90px; row-gap: 80px;
  width: 1470px; margin: 0 auto;
}

.cell { width: 430px; flex: none; }

.cell { display: flex; flex-direction: column; align-items: center; }

/* Fixed height, so a wide mark and a tall one still leave their captions on
   one line as each other. */
.cell__art { height: 180px; display: flex; align-items: center; justify-content: center; }
.cell__art svg {
  display: block; width: 180px; height: 180px;
  fill: none; stroke: #7FA8DC; stroke-width: 2.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.cell__art svg .hot { stroke: var(--blue); stroke-width: 3.6; }
.cell__art svg .hot-fill { fill: var(--blue); stroke: none; }
/* Real logos are filled marks, not line drawings. */
.cell__art .brand { width: 170px; height: 170px; fill: var(--ink); stroke: none; }
/* Sendblue's mark fills its whole square, where YouTube's is wide and short,
   so at one size it carries far more weight than the rest of the set. */
.cell__art .brand--tight { width: 142px; height: 142px; }

.cell__name {
  margin: 30px 0 0;
  font-size: 40px; font-weight: 600; letter-spacing: -0.006em;
  line-height: 1.22; color: var(--ink); text-align: center;
}
</style>
</head>
