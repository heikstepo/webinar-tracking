<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ecom versus high ticket</title>
<link rel="stylesheet" href="../../4pi.css">
<link rel="stylesheet" href="../../voice-quiet.css">
<style>
/* ============================================================================
   Two buyers, two path lengths.

   Both chains start at the same left edge and are drawn at the same scale, so
   the argument is made by length alone: the ecom row is finished before the
   high ticket row is a third of the way across. Centring either one, or sizing
   them to fill the width, would destroy exactly the thing being shown.

   Two figures rather than one, unlike the week slide: these are two different
   buyers of two different kinds of thing, not one person twice.

   The touchpoints are the same marks the week slide uses, so the two graphics
   read as one story told at two zoom levels.
   ========================================================================= */
@page { size: 1920px 1080px; margin: 0; }

.slide { width: 1920px; height: 1080px; padding: 90px 110px; background: var(--ground); }

.cmp { width: 1700px; text-align: left; }

.cmp__rule { height: 1px; background: var(--hairline); margin: 76px 0; }

.cmp__label {
  margin: 0 0 26px;
  font-size: 40px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink);
}

.chain { display: flex; align-items: center; gap: 26px; }

.chain__who { flex: none; }
.chain__who svg { display: block; width: 80px; height: 182px; fill: var(--ink); }

.chain__art { flex: none; }
.chain__art svg {
  display: block; width: 152px; height: 152px;
  fill: none; stroke: #7FA8DC; stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round;
}
.chain__art svg .hot { stroke: var(--blue); stroke-width: 3; }
.chain__art svg .hot-fill { fill: var(--blue); stroke: none; }
/* YouTube is a real logo, so it is a filled mark rather than a line drawing. */
.chain__art .yt { width: 158px; height: 158px; fill: var(--ink); stroke: none; }

.chain__arr { flex: none; }
.chain__arr svg { display: block; width: 74px; height: 26px; }

.chain__tick {
  flex: none;
  width: 152px; height: 152px; border-radius: 50%;
  background: #E7F5E3; border: 3px solid #34A518;
  display: flex; align-items: center; justify-content: center;
  font-size: 74px; line-height: 1; color: #248A13;
}
</style>
</head>
<body>

<!-- no-autofit: sized for 1920, and the fit pass would wrap these rows into
     the panel text column and destroy the length comparison. -->
<section class="slide slide--center">

  <div class="cmp">

    <p class="cmp__label">Ecom</p>
    <div class="chain">

      <div class="chain__who">
        <svg viewBox="0 0 66 150" aria-hidden="true">
          <circle cx="33" cy="16" r="14"/>
          <path d="M33 34 C 23 34, 17 41, 17 51 L 17 84 C 17 88, 21 90, 25 90
                   L 41 90 C 45 90, 49 88, 49 84 L 49 51 C 49 41, 43 34, 33 34 Z"/>
          <rect x="3"  y="46" width="11" height="44" rx="5.5"/>
          <rect x="52" y="46" width="11" height="44" rx="5.5"/>
          <rect x="19" y="88" width="12" height="58" rx="6"/>
          <rect x="35" y="88" width="12" height="58" rx="6"/>
        </svg>
      </div>

      <div class="chain__arr">
        <svg viewBox="0 0 74 26" aria-hidden="true">
          <g fill="none" stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13 H 60"/><path d="M50 4 L 69 13 L 50 22"/>
          </g>
        </svg>
      </div>

      <div class="chain__art">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>

      <div class="chain__arr">
        <svg viewBox="0 0 74 26" aria-hidden="true">
          <g fill="none" stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13 H 60"/><path d="M50 4 L 69 13 L 50 22"/>
          </g>
        </svg>
      </div>

      <div class="chain__tick">&#10003;</div>

    </div>

    <div class="cmp__rule"></div>

    <p class="cmp__label">High ticket</p>
    <div class="chain">

      <div class="chain__who">
        <svg viewBox="0 0 66 150" aria-hidden="true">
          <circle cx="33" cy="16" r="14"/>
          <path d="M33 34 C 23 34, 17 41, 17 51 L 17 84 C 17 88, 21 90, 25 90
                   L 41 90 C 45 90, 49 88, 49 84 L 49 51 C 49 41, 43 34, 33 34 Z"/>
          <rect x="3"  y="46" width="11" height="44" rx="5.5"/>
          <rect x="52" y="46" width="11" height="44" rx="5.5"/>
          <rect x="19" y="88" width="12" height="58" rx="6"/>
          <rect x="35" y="88" width="12" height="58" rx="6"/>
        </svg>
      </div>

      <div class="chain__arr">
        <svg viewBox="0 0 74 26" aria-hidden="true">
          <g fill="none" stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13 H 60"/><path d="M50 4 L 69 13 L 50 22"/>
          </g>
        </svg>
      </div>

      <div class="chain__art">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>

      <div class="chain__arr">
        <svg viewBox="0 0 74 26" aria-hidden="true">
          <g fill="none" stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13 H 60"/><path d="M50 4 L 69 13 L 50 22"/>
          </g>
        </svg>
      </div>

      <div class="chain__art">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>

      <div class="chain__arr">
        <svg viewBox="0 0 74 26" aria-hidden="true">
          <g fill="none" stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13 H 60"/><path d="M50 4 L 69 13 L 50 22"/>
          </g>
        </svg>
      </div>

      <div class="chain__art">
        <svg class="yt" viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </div>

      <div class="chain__arr">
        <svg viewBox="0 0 74 26" aria-hidden="true">
          <g fill="none" stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13 H 60"/><path d="M50 4 L 69 13 L 50 22"/>
          </g>
        </svg>
      </div>

      <div class="chain__art">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>

      <div class="chain__arr">
        <svg viewBox="0 0 74 26" aria-hidden="true">
          <g fill="none" stroke="#0071E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13 H 60"/><path d="M50 4 L 69 13 L 50 22"/>
          </g>
        </svg>
      </div>

      <div class="chain__tick">&#10003;</div>

    </div>

  </div>

</section>

</body>
</html>
