<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One idea five times</title>
<link rel="stylesheet" href="../../4pi.css">
<link rel="stylesheet" href="../../voice-quiet.css">
<style>
/* ============================================================================
   See build-ad-sets.py. A row (or two rows) of ad creatives, each one a frame
   over its line. The frames carry no art: the line is the point.

   Class names are prefixed as; neither shared sheet uses them.
   ========================================================================= */
@page { size: 1920px 1080px; margin: 0; }

.slide { position: relative; width: 1920px; height: 1080px; padding: 0;
         background: var(--ground); }

.as__h {
  position: absolute; left: 110px; top: 44px; margin: 0;
  font-size: 54px; font-weight: 600; letter-spacing: -0.022em; color: var(--ink);
}
.as__h i { font-style: normal; color: var(--blue); }
.as__h em { font-style: normal; color: var(--ink-3); font-weight: 600; }

.as__list { position: absolute; left: 110px; }

.as__card {
  box-sizing: border-box; width: 1700px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 18px; padding: 0 34px;
  box-shadow: 0 2px 12px rgba(20, 30, 50, 0.06);
  display: flex; align-items: center;
}
.as__card + .as__card { margin-top: 20px; }

/* the ad is a label, not a picture */
.as__n {
  width: 104px; flex: none; margin: 0;
  font-size: 17px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-3);
}
.as__bar { width: 1px; flex: none; background: var(--hairline); margin-right: 30px; }
.as__t {
  margin: 0;
  font-weight: 600; letter-spacing: -0.018em; line-height: 1.2; color: var(--ink);
}
.as__t i { font-style: normal; color: var(--blue); }
</style>
</head>
<body>

<!-- no-autofit: its own canvas, not a panel. -->
<section class="slide">

  <h1 class="as__h">5 Ads <em>-</em> <i>1 Idea 5 Times</i></h1>

  <div class="as__list" style="top:250px"><div class="as__card" style="height:128px"><p class="as__n">Ad 1</p><div class="as__bar" style="height:58.88px"></div><p class="as__t" style="font-size:44px">Make money with <i>TikTok Shop</i></p></div><div class="as__card" style="height:128px"><p class="as__n">Ad 2</p><div class="as__bar" style="height:58.88px"></div><p class="as__t" style="font-size:44px"><i>TikTok Shop</i> is exploding</p></div><div class="as__card" style="height:128px"><p class="as__n">Ad 3</p><div class="as__bar" style="height:58.88px"></div><p class="as__t" style="font-size:44px">Start a <i>TikTok Shop</i> brand</p></div><div class="as__card" style="height:128px"><p class="as__n">Ad 4</p><div class="as__bar" style="height:58.88px"></div><p class="as__t" style="font-size:44px"><i>TikTok Shop</i> opportunity 2026</p></div><div class="as__card" style="height:128px"><p class="as__n">Ad 5</p><div class="as__bar" style="height:58.88px"></div><p class="as__t" style="font-size:44px">Why <i>TikTok Shop</i> is huge</p></div></div>

</section>

</body>
</html>
