<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>We'll build and launch your ads funnel in 14 days</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
<style>
/* ============================================================================
   Panel version: our ground, our ink, our blue.

   800x1080 rather than 900x1080. The slot beside the camera crop is a tall
   narrow column, and a 900-wide canvas dropped into it gets stretched sideways
   to fill — which widens the type no matter how small the type is set. Cutting
   the canvas is the fix; shrinking the text was not.

   A hairline down the left edge, full height, so the panel reads as its own
   surface butting the video rather than as the frame simply running out.

   The offer is two claims, not one sentence: what we do, and what it costs.
   They were set as a single block joined by an em dash, which flattened them
   to the same weight and buried the terms at the end of a paragraph. Now the
   deliverable leads, a rule takes the dash's job, and the terms answer under
   it. The rule is the same short blue one the case study panels use, so the
   two read as one family.
   ========================================================================= */
@page { size: 800px 1080px; margin: 0; }

.slide {
  width: 800px;
  height: 1080px;
  padding: 90px 60px;
  background: var(--ground);
}

/* Sized for where it ends up, not for how it looks here. The panel gets scaled
   to roughly 400px wide in the edit, so a 1px hairline lands at under half a
   pixel and vanishes; 6px arrives as a clear line and still reads as a rule
   rather than a bar at that size. */
.edge {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 6px;
  background: #B9C0C9;
}

.offer {
  margin: 0;
  max-width: 680px;
  font-size: 46px;
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -0.016em;
  color: var(--ink);
}

.offer__rule {
  width: 56px; height: 3px; border-radius: 2px;
  background: var(--blue);
  margin: 40px auto;
}

.offer__terms {
  margin: 0;
  max-width: 640px;
  font-size: 30px;
  font-weight: 500;
  line-height: 1.34;
  letter-spacing: -0.006em;
  color: var(--ink-2);
}

/* One emphasis, on the phrase the whole offer turns on. A weighted underline
   rather than a filled block: this sits beside a talking head, not on a
   keynote screen. Namespaced because `.rule` already means a filled
   highlighter block in 4pi.css and wins on specificity. */
.say__mark {
  color: var(--blue);
  background: linear-gradient(to top, #C6DDFA 0 0.15em, transparent 0.15em);
}
</style>
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="edge"></div>

  <!-- Breaks set by hand: the emphasised phrase needs a line of its own, or
       the underline splits and reads as two separate marks. -->
  <p class="offer">
    We&rsquo;ll build and launch<br>
    your ads funnel<br>
    in 14 days.
  </p>

  <div class="offer__rule"></div>

  <p class="offer__terms">
    You only pay us from<br>
    <span class="say__mark">the revenue we generate</span>.
  </p>

</section>

</body>
</html>
