<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>We'll build and launch your ads funnel in 14 days</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
<style>
/* ============================================================================
   Panel version: our ground, our ink, our blue. Back off the borrowed cream
   and bronze — this is our style sitting beside his footage, not a copy of it.

   A hairline down the left edge, full height, so the panel reads as its own
   surface butting the video rather than as the frame simply running out.
   ========================================================================= */
@page { size: 900px 1080px; margin: 0; }

.slide {
  width: 900px;
  height: 1080px;
  padding: 90px 70px;
  background: var(--ground);
}

/* Sized for where it ends up, not for how it looks here. The panel gets scaled
   to roughly 400px wide in the edit, so a 1px hairline lands at under half a
   pixel and vanishes; 4px arrives as a visible line and still reads as a
   hairline at that size. */
.edge {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: #CDD2D8;
}

.say {
  margin: 0;
  max-width: 760px;
  font-size: 50px;
  font-weight: 600;
  line-height: 1.32;
  letter-spacing: -0.012em;
  color: var(--ink);
}

/* One emphasis. Namespaced because `.rule` already means a filled highlighter
   block in 4pi.css and wins on specificity. */
.say__mark {
  padding-bottom: 0.10em;
  border-bottom: 3px solid var(--blue);
}
</style>
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="edge"></div>

  <!-- Breaks set by hand: the emphasised phrase needs a line of its own or the
       rule splits and reads as two underlines, and the dash has to end a line
       rather than start one. -->
  <p class="say">
    We&rsquo;ll build and launch your<br>
    ads funnel in 14 days &mdash;<br>
    You only pay us from<br>
    <span class="say__mark">the revenue we generate</span>.
  </p>

</section>

</body>
</html>
