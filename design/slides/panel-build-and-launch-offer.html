<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>We'll build and launch your ads funnel in 14 days</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
<style>
@page { size: 900px 1080px; margin: 0; }
.slide { width: 900px; height: 1080px; padding: 90px 70px; background: #FFFFFF; }
</style>
</head>
<body>

<section class="slide slide--center slide--mid">

  <!-- Two claims, one emphasis. The house voice dropped the highlighter wash a
       while back, so the reference's yellow block becomes a single thin rule.

       The breaks are set by hand rather than left to wrap. Two reasons: the
       emphasised phrase has to land on one line of its own or the rule splits
       across two and reads as two underlines, and the dash has to end a line
       rather than start one. Sized off the longest of the four — 730px at
       58px against a 760px column, with 60px the point it touches the edge. -->
  <h2 class="h2" style="font-size:58px; line-height:1.28; max-width:760px">
    We&rsquo;ll build and launch your<br>
    ads funnel in 14 days &mdash;<br>
    You only pay us from<br>
    <span class="mark--rule">the revenue we generate</span>.
  </h2>

</section>

</body>
</html>
