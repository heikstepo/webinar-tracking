<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Which ad next</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="seq" style="height:420px">

    <!-- The mechanism drawn once, in full, top left: one person, one
         impression, one decision. Then it stops being drawn and becomes the
         run of steps underneath, which is the same thing eight times over. -->

    <svg class="person" viewBox="0 0 24 24" aria-hidden="true"
         style="position:absolute; left:135px; top:0"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-4.1 3.4-7.2 7.5-7.2s7.5 3.1 7.5 7.2"/></svg>

    <div class="seq__pill" style="left:235px; top:6px; width:130px">Ad</div>

    <p class="seq__stage" style="left:322px; top:52px; text-align:left">Impression</p>

    <div class="seq__pill" style="left:210px; top:100px; width:180px; height:48px;
                                  font-size:22px; background:var(--accent);
                                  border-color:var(--accent); color:#fff">Meta</div>

    <div class="question" style="position:absolute; left:300px; top:204px;
                                 transform:translateX(-50%);
                                 font-size:26px; padding:16px 28px; white-space:nowrap">Which ad next?</div>

    <!-- Eight steps, unlabelled past their number: the point is the length of
         the run, not what each one says. -->
    <div class="seq__step" style="left:287px; top:327px">1</div>
    <div class="seq__step" style="left:380px; top:327px">2</div>
    <div class="seq__step" style="left:473px; top:327px">3</div>
    <div class="seq__step" style="left:566px; top:327px">4</div>
    <div class="seq__step" style="left:659px; top:327px">5</div>
    <div class="seq__step" style="left:752px; top:327px">6</div>
    <div class="seq__step" style="left:845px; top:327px">7</div>
    <div class="seq__step" style="left:938px; top:327px">8</div>

    <div class="seq__conv" style="left:1021px; top:310px">&#10003;</div>
    <p class="seq__conv-label" style="left:901px; top:382px">Conversion</p>

    <svg class="seq__path" viewBox="0 0 1240 420" fill="none" aria-hidden="true">
      <defs>
        <marker id="qn" viewBox="0 0 10 10" refX="7" refY="5"
                markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0.5 0.5 L9 5 L0.5 9.5" fill="none" stroke="#0071E3"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="qs" viewBox="0 0 10 10" refX="7" refY="5"
                markerWidth="5.4" markerHeight="5.4" orient="auto">
          <path d="M0.5 0.5 L9 5 L0.5 9.5" fill="none" stroke="#9DC4EE"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <g stroke="#0071E3" stroke-width="3" stroke-linecap="round" marker-end="url(#qn)">
        <path d="M187 23 L 219 23"/>
        <path d="M300 48 L 300 92"/>
        <path d="M300 156 L 300 196"/>
        <path d="M300 276 L 300 314"/>
      </g>

      <!-- The run itself is drawn lighter than the mechanism above it, so the
           eye reads the explanation first and the length second. -->
      <g stroke="#9DC4EE" stroke-width="2.4" stroke-linecap="round" marker-end="url(#qs)">
        <path d="M317 340 L 374 340"/>
        <path d="M410 340 L 467 340"/>
        <path d="M503 340 L 560 340"/>
        <path d="M596 340 L 653 340"/>
        <path d="M689 340 L 746 340"/>
        <path d="M782 340 L 839 340"/>
        <path d="M875 340 L 932 340"/>
        <path d="M968 340 L 1013 340"/>
      </g>
    </svg>

  </div>

</section>

</body>
</html>
