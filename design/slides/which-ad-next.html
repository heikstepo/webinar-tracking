<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Which ad next</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="seq" style="height:420px">

    <!-- One person, one impression, one decision. The chain runs straight down
         because the whole point of the decision is that it moves them down;
         the rail on the right says where they started and where they land. -->

    <svg class="person" viewBox="0 0 24 24" aria-hidden="true"
         style="position:absolute; left:385px; top:0"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-4.1 3.4-7.2 7.5-7.2s7.5 3.1 7.5 7.2"/></svg>

    <div class="seq__pill" style="left:485px; top:6px; width:130px">Ad</div>

    <p class="seq__stage" style="left:572px; top:52px; text-align:left">Impression</p>

    <div class="seq__pill" style="left:460px; top:100px; width:180px; height:48px;
                                  font-size:22px; background:var(--accent);
                                  border-color:var(--accent); color:#fff">Meta</div>

    <div class="question" style="position:absolute; left:550px; top:204px;
                                 transform:translateX(-50%);
                                 font-size:26px; padding:16px 28px; white-space:nowrap">Which ad next?</div>

    <div class="seq__pill" style="left:485px; top:320px; width:130px">Next ad</div>

    <p class="seq__stage" style="left:690px; top:13px;  text-align:left">Top of funnel</p>
    <p class="seq__stage" style="left:690px; top:327px; text-align:left">Middle of funnel</p>

    <svg class="seq__path" viewBox="0 0 1240 420" fill="none" aria-hidden="true">
      <defs>
        <marker id="qn" viewBox="0 0 10 10" refX="7" refY="5"
                markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0.5 0.5 L9 5 L0.5 9.5" fill="none" stroke="#0071E3"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>
      <g stroke="#0071E3" stroke-width="3" stroke-linecap="round" marker-end="url(#qn)">
        <path d="M437 23 L 469 23"/>
        <path d="M550 48 L 550 92"/>
        <path d="M550 156 L 550 196"/>
        <path d="M550 276 L 550 312"/>
      </g>
      <!-- And then it happens again, one stage lower. -->
      <path d="M550 368 L 550 408" stroke="#0071E3" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="3 9" opacity="0.42"
            marker-end="url(#qn)"/>
    </svg>

  </div>

</section>

</body>
</html>
