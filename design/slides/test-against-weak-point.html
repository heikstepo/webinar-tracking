<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test against the weak point</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--top slide--mid">

  <h2 class="h3" style="margin-top:10px">Test against the weak point</h2>

  <div class="nest" style="--nest-w:1100px; --nest-pad:30px; margin-top:88px">
    <p class="nest__label">1 CBO campaign</p>

    <div style="display:flex; gap:24px; align-items:stretch">

      <div class="nest__inner" style="flex:1">
        <p class="nest__label" style="margin-bottom:0">1 control ad set</p>
        <div class="dots" style="--cols:4; --dot:80px; --dot-gap:26px">
            <span class="dot" style="background:#F6B827; border:none"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot dot--ghost"></span>
            <span class="dot dot--ghost"></span>
            <span class="dot dot--ghost"></span>
        </div>
        <p class="nest__caption">5&ndash;8 unique ads</p>
      </div>

      <div class="nest__inner" style="width:300px; display:flex; flex-direction:column;
                                      align-items:center; justify-content:center; gap:28px">
        <p class="nest__label" style="margin-bottom:0">Test ad set</p>
        <span class="dot" style="--dot:80px; background:#F6B827; border:none"></span>
      </div>

    </div>
  </div>

</section>

</body>
</html>
