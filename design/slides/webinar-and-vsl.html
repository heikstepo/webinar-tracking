<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Webinar and VSL</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="pieces">

    <!-- Both are a screen with a video on it, so the screen alone cannot tell
         them apart. What separates them is who is in the room: the webinar has
         an audience watching at the same time, the VSL has a scrubber and one
         viewer moving through it alone. -->
    <div class="piece">
      <svg viewBox="0 0 124 124" aria-hidden="true">
        <rect x="12" y="12" width="100" height="62" rx="8"/>
        <!-- what is on the screen: someone presenting to the room -->
        <circle class="hot" cx="42" cy="34" r="7"/>
        <path class="hot" d="M30 56 C 30 46, 35.5 41, 42 41 C 48.5 41, 54 46, 54 56"/>
        <path d="M68 32 H 96 M68 42 H 90 M68 52 H 96"/>
        <!-- and who is watching it, live, together -->
        <circle cx="32" cy="92" r="7"/>
        <path d="M20 112 C 20 102, 25.5 97, 32 97 C 38.5 97, 44 102, 44 112"/>
        <circle cx="62" cy="92" r="7"/>
        <path d="M50 112 C 50 102, 55.5 97, 62 97 C 68.5 97, 74 102, 74 112"/>
        <circle cx="92" cy="92" r="7"/>
        <path d="M80 112 C 80 102, 85.5 97, 92 97 C 98.5 97, 104 102, 104 112"/>
      </svg>
      <p class="piece__name">Webinar</p>
    </div>

    <div class="piece">
      <svg viewBox="0 0 124 124" aria-hidden="true">
        <rect x="12" y="18" width="100" height="88" rx="11"/>
        <path class="hot-fill" d="M53 46 L 78 60 L 53 74 Z"/>
        <!-- the scrubber: one viewer, working their own way through it -->
        <path d="M26 92 H 98"/>
        <circle class="hot-fill" cx="48" cy="92" r="5"/>
      </svg>
      <p class="piece__name">VSL</p>
    </div>

  </div>

</section>

</body>
</html>
