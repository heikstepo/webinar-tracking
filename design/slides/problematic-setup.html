<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Problematic campaign setups</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--top slide--mid">

  <h2 class="h3" style="margin-top:10px">Problematic Campaign Setups</h2>

  <div class="nest" style="margin-top:100px">
    <p class="nest__label">1 ABO campaign</p>

    <div class="nest__inner">
      <p class="nest__label" style="margin-bottom:0">1 broad ad set</p>

      <div class="dots" style="--cols:10">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
      </div>

      <p class="nest__caption">30 ad creatives</p>
    </div>

    <!-- Struck through, thin: the setup stays fully readable underneath. -->
    <svg class="nest__cross" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="0" x2="100" y2="100" stroke="#E31D3E" stroke-width="6"
            stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <line x1="100" y1="0" x2="0" y2="100" stroke="#E31D3E" stroke-width="6"
            stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

</section>

</body>
</html>
