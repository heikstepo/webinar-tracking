<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How many sequences</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center">

  <!-- Two counts, two calculations, one left edge. The second line of digits
       runs almost the full width of the slide next to a three-digit answer,
       which is the whole argument — so nothing else on the slide states it. -->

  <div class="dots dots--filled" style="--cols:5; --dot:30px; --dot-gap:14px; width:max-content; margin:0">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span>
  </div>

  <p class="calc" style="margin-top:30px">
    <span class="calc__n">5!</span><span class="calc__eq">=</span>120<span class="calc__unit">sequences</span>
  </p>

  <div class="dots dots--filled" style="--cols:10; --dot:30px; --dot-gap:14px; width:max-content; margin:86px 0 0">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <p class="calc" style="margin-top:30px">
    <span class="calc__n">30!</span><span class="calc__eq">=</span>265,252,859,812,191,058,636,308,480,000,000<span class="calc__unit">possible sequences</span>
  </p>

</section>

</body>
</html>
