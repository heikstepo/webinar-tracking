<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Let Meta re-allocate spend</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--top slide--mid">

  <h2 class="h3" style="margin-top:10px">Let Meta Re-Allocate Spend, Find winner</h2>

  <!-- Fixed stage: the arrow has to land on the test creative. -->
  <div style="position:relative; width:1240px; height:412px; flex:none; margin-top:74px">

    <div class="nest" style="--nest-w:900px; --nest-pad:30px; position:absolute; left:0; top:0">
      <p class="nest__label">1 CBO campaign</p>

      <div style="display:flex; gap:24px; align-items:stretch">

        <div class="nest__inner" style="flex:1">
          <p class="nest__label" style="margin-bottom:0">1 control ad set</p>
          <div class="dots" style="--cols:4; --dot:70px; --dot-gap:24px">
              <span class="dot" style="background:#F6B827; border:none"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot dot--ghost"></span>
              <span class="dot dot--ghost"></span>
              <span class="dot dot--ghost"></span>
          </div>
          <p class="nest__caption">5&ndash;8 unique ads</p>
        </div>

        <div class="nest__inner" style="width:260px; display:flex; flex-direction:column;
                                        align-items:center; justify-content:center; gap:28px">
          <p class="nest__label" style="margin-bottom:0">Test ad set</p>
          <span class="dot" style="--dot:70px; background:#F6B827; border:none"></span>
        </div>

      </div>
    </div>

    <div style="position:absolute; left:915px; top:186px; width:320px; text-align:left">
      <p style="margin:0; font-size:26px; font-weight:600; letter-spacing:-0.006em;
                color:var(--ink)">earns spend</p>
      <p style="margin:10px 0 0; font-size:22px; font-weight:400; line-height:1.45;
                color:var(--ink)">High Frequency, High CPM, &ldquo;lower&rdquo; spend, <span style="color:#248A13">lower CPR</span></p>
    </div>

    <svg style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none"
         viewBox="0 0 1240 412" fill="none" aria-hidden="true">
      <defs>
        <marker id="sp" viewBox="0 0 10 10" refX="7" refY="5"
                markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0.5 0.5 L9 5 L0.5 9.5" fill="none" stroke="#1D1D1F"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>
      <path d="M905 256 L 783 256" stroke="#1D1D1F" stroke-width="2.5"
            stroke-linecap="round" marker-end="url(#sp)"/>
    </svg>

  </div>

</section>

</body>
</html>
