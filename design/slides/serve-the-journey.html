<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serve the journey</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <!-- One sentence, nothing else, all one ink. Set small on a short measure
       with open leading: at this size the sentence reads as something said
       rather than something announced, and the air around it does the work
       that colour would otherwise be doing. -->
  <p style="font-size:42px; font-weight:600; line-height:1.36;
            letter-spacing:-0.004em; color:var(--ink);
            max-width:880px; margin:0 auto">
    If Meta is getting better at understanding where somebody is in their
    journey, I want to give it different ads that can actually serve
    different parts of that journey.
  </p>

</section>

</body>
</html>
