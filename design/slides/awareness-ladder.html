<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Awareness ladder</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="ladder">
    <p class="ladder__label">TOFU:</p>
    <p class="ladder__quote">&ldquo;I have this problem.&rdquo;</p>
    <p class="ladder__alt">(TOFU: &ldquo;I have a great opportunity in front of me&rdquo;)</p>

    <p class="ladder__label">MOFU:</p>
    <p class="ladder__quote">&ldquo;Meta ads could solve it.&rdquo;</p>

    <p class="ladder__label">BOFU 1:</p>
    <p class="ladder__quote">&ldquo;I want someone to do this for me.&rdquo;</p>

    <p class="ladder__label">BOFU 2:</p>
    <p class="ladder__quote">&ldquo;I should choose them&rdquo;</p>
  </div>

</section>

</body>
</html>
