<!doctype html>
<html lang="en">
<head>

<title>Three concepts per ad</title>
<link rel="stylesheet" href="../4pi.css">

<style>
/* ============================================================================
   The journey read downwards: every ad on the line holds three creatives.

   Stacked under each ad rather than laid side by side, so the three become
   rows that can be named once on the left instead of twenty-four times across
   the slide. Each column sits on its own panel — without one the grid reads as
   loose tiles in rows, and "three inside one ad" is the whole claim. Each
   column also inherits its ad's tint, which keeps it reading as that ad's
   family rather than as three unrelated squares.
   ========================================================================= */

.pj { position: relative; width: 1240px; height: 356px; flex: none; }

.pj__axis { position: absolute; inset: 0; width: 100%; height: 100%; }

.pj__ad {
  position: absolute; top: 32px;
  width: 56px; height: 56px; border-radius: 50%;
  border: 1.5px solid;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 600; color: var(--ink);
}

/* A short drop from each ad onto its own panel, so the grouping is stated and
   not merely implied by two things happening to share an x. */
.pj__drop { position: absolute; top: 88px; width: 2px; height: 8px; background: #CFD8E2; }

.pj__hold {
  position: absolute; top: 94px;
  width: 94px; height: 252px;
  border-radius: 18px;
  background: var(--surface);
  border: 1px solid var(--hairline);
}

.cre {
  position: absolute;
  width: 66px; height: 66px;
  border-radius: 12px;
  border: 1.5px solid;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
}
.cre svg { width: 15px; height: 15px; fill: rgba(20, 60, 120, 0.42); margin-bottom: 3px; }
.cre i { display: block; height: 4px; border-radius: 2px; background: rgba(20, 60, 120, 0.16); }

.pj__row {
  position: absolute; left: 0; width: 130px; margin: 0;
  text-align: right;
  font-size: 18px; font-weight: 600; letter-spacing: -0.002em; color: #6C7A8C;
}

.pj__conv {
  position: absolute; left: 1100px; top: 30px;
  width: 60px; height: 60px; border-radius: 50%;
  background: #E7F5E3; border: 2px solid #34A518;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; line-height: 1; color: #248A13;
}
</style>
</head>
