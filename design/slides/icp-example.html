<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example: SaaS Consulting Offer</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
<style>
/* ============================================================================
   See build-icp-example.py. Labels are emphasised in place rather than lifted
   out into chips, so the lines stay exactly as written.
   ========================================================================= */
@page { size: 800px 1080px; margin: 0; }

.slide { width: 800px; height: 1080px; padding: 90px 60px; background: var(--ground); }

/* Full height hairline against the camera crop, as on every panel. */
.edge { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #B9C0C9; }

.ex { margin: 0; font-size: 44px; font-weight: 600; line-height: 1.2;
      letter-spacing: -0.016em; color: var(--ink); }
/* The framing word, quieter than the thing being framed. */
.ex__k { color: var(--ink-3); }

.exrule { width: 56px; height: 3px; border-radius: 2px; background: var(--blue);
          margin: 44px auto; }

.icps { display: flex; flex-direction: column; gap: 34px;
        width: 640px; text-align: left; }

/* Label beside the text, not in front of it: the long line wraps under its own
   first word rather than under the label. */
.icprow { display: flex; gap: 12px; align-items: baseline;
          font-size: 27px; font-weight: 500; line-height: 1.34;
          letter-spacing: -0.004em; color: var(--ink); }
.icprow__k { flex: none; font-weight: 600; color: var(--blue); }
</style>
</head>
<body>

<section class="slide slide--center slide--mid">
  <div class="edge"></div>

  <p class="ex"><span class="ex__k">Example:</span> SaaS Consulting Offer</p>

  <div class="exrule"></div>

  <div class="icps">
    <div class="icprow"><span class="icprow__k">ICP 1:</span><span>Live SaaS, struggle with marketing and conversion</span></div>
    <div class="icprow"><span class="icprow__k">ICP 2:</span><span>Close to Launching, no clear plan</span></div>
  </div>

</section>

</body>
</html>
