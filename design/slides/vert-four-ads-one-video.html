<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three ads, a video, then the fourth ad lands</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
<style>
/* ============================================================================
   The phone cut of the same sequence.

   Turned 90 degrees rather than squeezed: five stops with their labels cannot
   sit across 1080px without the type dropping below reading size. The rail runs
   down from the figure's feet, so the person is still the start of it and is
   still drawn only once.

   Labels sit beside their icons rather than under them. Under, each row needs
   its own vertical space for two things instead of one, and five of those runs
   off the bottom of the frame.

   Sized to leave bars top and bottom in a 9:16 frame, not to fill it.
   ========================================================================= */
@page { size: 1080px 1280px; margin: 0; }

.slide { width: 1080px; height: 1280px; padding: 70px; background: var(--ground); }

/* Shrink to fit rather than a set width: the rows are different lengths, so a
   fixed column centres the box and leaves the drawing itself sitting left. */
.jr { position: relative; width: max-content; margin: 0 auto; text-align: left; }

/* The person. Solid ink, with real gaps left between the arms and the torso —
   overlapped, they merge into one lump and the silhouette stops reading. */
.jr__who { width: 88px; display: flex; justify-content: center; }
.jr__who svg { display: block; width: 78px; height: 184px; fill: var(--ink); }

/* From under the figure down to the last dot, so the five read as one run. */
.jr__line {
  position: absolute; left: 42.5px; top: 200px; bottom: 82px;
  width: 3px; background: #D2D8E0; border-radius: 2px;
}

.hit { position: relative; display: flex; align-items: center; height: 164px; }

.hit__dot { flex: none; width: 88px; display: flex; justify-content: center; }
.hit__dot i {
  display: block; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ground); border: 3px solid #A9B6C6;
}

.hit__art { flex: none; width: 130px; display: flex; justify-content: center; }
.hit__art svg {
  display: block; width: 120px; height: 120px;
  fill: none; stroke: #7FA8DC; stroke-width: 2.4;
  stroke-linecap: round; stroke-linejoin: round;
}
.hit__art svg .hot { stroke: var(--blue); stroke-width: 3.2; }
.hit__art svg .hot-fill { fill: var(--blue); stroke: none; }
/* YouTube is a real logo, so it is a filled mark rather than a line drawing. */
.hit__art .yt { width: 128px; height: 128px; fill: var(--ink); stroke: none; }

.hit__txt { margin-left: 34px; }
.hit__name {
  margin: 0; white-space: nowrap;
  font-size: 44px; font-weight: 600; letter-spacing: -0.008em; color: var(--ink);
}

/* The ad that lands: full accent, and the outcome named under it in the green
   this deck uses for a sale everywhere else. */
.hit--5 .hit__art svg { stroke: var(--blue); stroke-width: 3.2; }
.hit--5 .hit__dot i { border-color: #34A518; background: #34A518; }
.hit__won {
  margin: 6px 0 0;
  font-size: 36px; font-weight: 600; letter-spacing: -0.008em; color: #248A13;
}
</style>
</head>
<body>

<!-- no-autofit: its own canvas, not a panel. -->
<section class="slide slide--center slide--mid">

  <div class="jr">

    <div class="jr__who">
      <svg viewBox="0 0 66 150" aria-hidden="true">
        <circle cx="33" cy="16" r="14"/>
        <path d="M33 34 C 23 34, 17 41, 17 51 L 17 84 C 17 88, 21 90, 25 90
                 L 41 90 C 45 90, 49 88, 49 84 L 49 51 C 49 41, 43 34, 33 34 Z"/>
        <rect x="3"  y="46" width="11" height="44" rx="5.5"/>
        <rect x="52" y="46" width="11" height="44" rx="5.5"/>
        <rect x="19" y="88" width="12" height="58" rx="6"/>
        <rect x="35" y="88" width="12" height="58" rx="6"/>
      </svg>
    </div>

    <div class="jr__line"></div>

    <div class="hit hit--1">
      <span class="hit__dot"><i></i></span>
      <div class="hit__art">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>
      <div class="hit__txt"><p class="hit__name">Ad 1</p></div>
    </div>

    <div class="hit hit--2">
      <span class="hit__dot"><i></i></span>
      <div class="hit__art">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>
      <div class="hit__txt"><p class="hit__name">Ad 2</p></div>
    </div>

    <div class="hit hit--3">
      <span class="hit__dot"><i></i></span>
      <div class="hit__art">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>
      <div class="hit__txt"><p class="hit__name">Ad 3</p></div>
    </div>

    <!-- not an ad: they went looking themselves -->
    <div class="hit hit--4">
      <span class="hit__dot"><i></i></span>
      <div class="hit__art">
        <svg class="yt" viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </div>
      <div class="hit__txt"><p class="hit__name">YouTube video</p></div>
    </div>

    <div class="hit hit--5">
      <span class="hit__dot"><i></i></span>
      <div class="hit__art">
        <svg viewBox="0 0 124 124" aria-hidden="true">
          <rect x="12" y="14" width="100" height="96" rx="11"/>
          <rect x="24" y="26" width="76" height="40" rx="6"/>
          <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
          <path d="M24 78 H 92 M24 88 H 72"/>
          <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
        </svg>
      </div>
      <div class="hit__txt">
        <p class="hit__name">Ad 4</p>
        <p class="hit__won">Converts</p>
      </div>
    </div>

  </div>

</section>

</body>
</html>
