<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ICP, messaging, offer positioning</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
<style>
/* ============================================================================
   Three phrases, stacked.

   Even spacing and one weight throughout, deliberately: they are three things
   of equal standing, and the gaps are equal so the stack can be revealed a
   line at a time in the edit without anything shifting. No dividers, numbers
   or bullets for the same reason — each would be another thing to mask.
   ========================================================================= */
@page { size: 800px 1080px; margin: 0; }

.slide { width: 800px; height: 1080px; padding: 90px 60px; background: var(--ground); }

/* Full height hairline against the camera crop, as on every panel. */
.edge { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #B9C0C9; }

.stack3 { display: flex; flex-direction: column; align-items: center; gap: 54px; }

.stack3 p {
  margin: 0;
  font-size: 62px;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.018em;
  color: var(--ink);
}
</style>
</head>
<body>

<section class="slide slide--center slide--mid">

  <div class="edge"></div>

  <div class="stack3">
    <p>ICP</p>
    <p>Messaging</p>
    <p>Offer Positioning</p>
  </div>

</section>

</body>
</html>
