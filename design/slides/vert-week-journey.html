<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One week, vertical</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
<style>
/* ============================================================================
   The one-week journey, turned upright for a phone.

   1080x1500 rather than a full 9:16 screen, so dropped into a vertical video it
   leaves bars at the top and bottom. Not 4:5: at that height a single day gap
   is too short to hold a legible card without Monday and Tuesday touching.

   Not the widescreen version squashed: a five stop horizontal timeline cannot
   survive being narrowed, so the track runs down instead and each stop becomes
   a row — dot, what they saw, which day. Everything else is the same argument:
   one figure drawn once at the top, and the stops placed at their real position
   in the week so Wednesday and Friday read as the gaps they are.
   ========================================================================= */
@page { size: 1080px 1500px; margin: 0; }

.slide { width: 1080px; height: 1500px; padding: 80px; background: var(--ground); }

.vwk { width: 920px; }

/* The person, once, at the head of the week. Indented so they stand over the
   line the week runs down. */
/* Clear of the first stop: each row is pulled up by half its own height, so
   too small a gap here and the Monday card climbs into the figure's legs. */
.vwk__who { padding-left: 200px; margin-bottom: 90px; }
.vwk__who svg { display: block; width: 88px; height: 200px; fill: var(--ink); }

/* Indented so the block of dot, card and day sits optically centred on the
   card rather than hard against the left edge. */
.vwk__track { position: relative; height: 880px; }

.vwk__line {
  position: absolute; left: 251px; top: 0; bottom: 0; width: 3px;
  background: #D2D8E0; border-radius: 2px;
}

/* Placed by day, not distributed: days 1, 2, 4, 6 and the sale on 7. */
.vstop {
  position: absolute; left: 240px; right: 0;
  display: flex; align-items: center; gap: 36px;
  transform: translateY(-50%);
}
.vstop--mon  { top: 0%; }
.vstop--tue  { top: 16.7%; }
.vstop--thu  { top: 50%; }
.vstop--sat  { top: 83.3%; }
.vstop--conv { top: 100%; }

.vstop__dot {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  margin-left: 0;
  background: var(--ground); border: 3px solid #A9B6C6;
}

.vstop__art { flex: none; width: 130px; display: flex; justify-content: center; }
.vstop__art svg {
  display: block; width: 118px; height: 118px;
  fill: none; stroke: #7FA8DC; stroke-width: 2.4;
  stroke-linecap: round; stroke-linejoin: round;
}
.vstop__art svg .hot { stroke: var(--blue); stroke-width: 3.2; }
.vstop__art svg .hot-fill { fill: var(--blue); stroke: none; }
/* YouTube is a real logo, so it is a filled mark rather than a line drawing. */
.vstop__art .yt { width: 126px; height: 126px; fill: var(--ink); stroke: none; }

.vstop__day {
  margin: 0;
  font-size: 52px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink);
}

/* The sale. Green and a size up, because it is the outcome rather than another
   thing that happened. */
.vstop--conv .tick {
  width: 130px; height: 130px; border-radius: 50%;
  background: #E7F5E3; border: 3px solid #34A518;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px; line-height: 1; color: #248A13;
}
.vstop--conv .vstop__art { width: 130px; }
.vstop--conv .vstop__dot { border-color: #34A518; background: #34A518; }
.vstop--conv .vstop__day { color: #248A13; }
</style>
</head>
<body>

<!-- no-autofit: its own canvas, not a panel. -->
<section class="slide slide--center">

  <div class="vwk">

    <div class="vwk__who">
      <svg viewBox="0 0 66 150" aria-hidden="true">
        <circle cx="33" cy="16" r="14"/>
        <path d="M33 34 C 23 34, 17 41, 17 51 L 17 84 C 17 88, 21 90, 25 90
                 L 41 90 C 45 90, 49 88, 49 84 L 49 51 C 49 41, 43 34, 33 34 Z"/>
        <rect x="3"  y="46" width="11" height="44" rx="5.5"/>
        <rect x="52" y="46" width="11" height="44" rx="5.5"/>
        <rect x="19" y="88" width="12" height="58" rx="6"/>
        <rect x="35" y="88" width="12" height="58" rx="6"/>
      </svg>
    </div>

    <div class="vwk__track">
      <div class="vwk__line"></div>

      <div class="vstop vstop--mon">
        <span class="vstop__dot"></span>
        <div class="vstop__art">
          <svg viewBox="0 0 124 124" aria-hidden="true">
            <rect x="12" y="14" width="100" height="96" rx="11"/>
            <rect x="24" y="26" width="76" height="40" rx="6"/>
            <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
            <path d="M24 78 H 92 M24 88 H 72"/>
            <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
          </svg>
        </div>
        <p class="vstop__day">Monday</p>
      </div>

      <div class="vstop vstop--tue">
        <span class="vstop__dot"></span>
        <div class="vstop__art">
          <svg viewBox="0 0 124 124" aria-hidden="true">
            <rect x="12" y="14" width="100" height="96" rx="11"/>
            <rect x="24" y="26" width="76" height="40" rx="6"/>
            <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
            <path d="M24 78 H 92 M24 88 H 72"/>
            <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
          </svg>
        </div>
        <p class="vstop__day">Tuesday</p>
      </div>

      <!-- not an ad: they went looking themselves -->
      <div class="vstop vstop--thu">
        <span class="vstop__dot"></span>
        <div class="vstop__art">
          <svg class="yt" viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </div>
        <p class="vstop__day">Thursday</p>
      </div>

      <div class="vstop vstop--sat">
        <span class="vstop__dot"></span>
        <div class="vstop__art">
          <svg viewBox="0 0 124 124" aria-hidden="true">
            <rect x="12" y="14" width="100" height="96" rx="11"/>
            <rect x="24" y="26" width="76" height="40" rx="6"/>
            <path class="hot-fill" d="M56 36 L 72 46 L 56 56 Z"/>
            <path d="M24 78 H 92 M24 88 H 72"/>
            <rect class="hot" x="24" y="96" width="40" height="6" rx="3"/>
          </svg>
        </div>
        <p class="vstop__day">Saturday</p>
      </div>

      <div class="vstop vstop--conv">
        <span class="vstop__dot"></span>
        <div class="vstop__art"><div class="tick">&#10003;</div></div>
        <p class="vstop__day">Converts</p>
      </div>

    </div>

  </div>

</section>

</body>
</html>
