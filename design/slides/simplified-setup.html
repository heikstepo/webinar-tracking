<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The simplified campaign setup</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--top slide--mid">

  <h2 class="h3" style="margin-top:10px">The Simplified Campaign Setup</h2>

  <div class="split" style="--split-l:520px; margin-top:104px">

    <!-- Left: the same diagram, now with room to breathe. -->
    <div class="split__col">
      <div class="nest" style="--nest-w:520px; --nest-pad:26px; --dot:72px; --dot-gap:24px">
        <p class="nest__label">1 CBO campaign</p>

        <div class="nest__inner">
          <p class="nest__label" style="margin-bottom:0">1 control ad set</p>

          <div class="dots" style="--cols:4">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot dot--ghost"></span>
            <span class="dot dot--ghost"></span>
            <span class="dot dot--ghost"></span>
          </div>

          <p class="nest__caption">5&ndash;8 unique ads</p>
        </div>

        <div class="nest__ok">&#10003;</div>
      </div>
    </div>

    <div class="split__rule"></div>

    <!-- Right: the rules that make it work. -->
    <div class="split__col">
      <ul class="points">
        <li>1 CBO campaign per <b>target avatar</b></li>
        <li>1 <b>control</b> ad set</li>
        <li><b>5&ndash;8 unique ads</b> in that one ad set</li>
        <li>Each ad serves a <b>different purpose</b></li>
      </ul>
    </div>

  </div>

</section>

</body>
</html>
