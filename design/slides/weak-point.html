<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Searching for the weak point</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--top slide--mid">

  <h2 class="h3" style="margin-top:10px">Searching for the weak point</h2>

  <div style="position:relative; width:1240px; height:480px; flex:none; margin-top:48px">

    <div class="funnel-wrap" style="--fw:700px; --fbh:104px; --fsz:18px;
                                    position:absolute; left:0; top:0">
      <div class="funnel">

        <div class="funnel__band funnel__band--1">
          <p class="funnel__stage">Top of funnel</p>
          <div class="funnel__ads" style="gap:16px">
            <span class="dot" style="--dot:48px; background:#34A518; border:none"></span>
            <span class="dot" style="--dot:48px; background:#34A518; border:none"></span>
            <span class="dot" style="--dot:48px; background:#34A518; border:none"></span>
          </div>
        </div>

        <div class="funnel__band funnel__band--2">
          <p class="funnel__stage">Middle of funnel</p>
          <div class="funnel__ads" style="gap:16px">
            <span class="dot" style="--dot:48px; background:#34A518; border:none"></span>
          </div>
        </div>

        <div class="funnel__band funnel__band--3">
          <p class="funnel__stage">Bottom of funnel</p>
          <div class="funnel__ads" style="gap:16px">
            <span class="dot" style="--dot:48px; background:#E31D3E; border:none"></span>
          </div>
        </div>

        <div class="funnel__neck"></div>
      </div>

      <div class="funnel__stem"></div>

      <div class="conversion">
        <div class="conversion__mark">&#10003;</div>
        <p class="conversion__label">Conversion</p>
      </div>
    </div>

    <p style="position:absolute; left:780px; top:246px; width:460px; margin:0;
              text-align:left; font-size:27px; font-weight:500; line-height:1.45;
              letter-spacing:-0.004em; color:var(--ink)">BOF ad: High CPM, High Frequence, Low Spend, <span style="color:#E31D3E">High CPR</span></p>

  </div>

</section>

</body>
</html>
