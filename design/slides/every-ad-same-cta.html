<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Every ad, the same ask</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <!-- The left column counts up and the right one never moves. Six identical
       pills stacked in a straight line is the whole point, so the destination
       is drawn as a solid object rather than set as grey supporting text. -->
  <div class="rows">

    <p class="rows__from">Ad 1</p>
    <p class="rows__arrow">&#8594;</p>
    <p class="rows__to">Book a call</p>

    <p class="rows__from">Ad 2</p>
    <p class="rows__arrow">&#8594;</p>
    <p class="rows__to">Book a call</p>

    <p class="rows__from">Ad 3</p>
    <p class="rows__arrow">&#8594;</p>
    <p class="rows__to">Book a call</p>

    <p class="rows__from">Ad 4</p>
    <p class="rows__arrow">&#8594;</p>
    <p class="rows__to">Book a call</p>

    <p class="rows__more">&#8942;</p>
    <p></p>
    <p></p>

    <p class="rows__from">Ad 30</p>
    <p class="rows__arrow">&#8594;</p>
    <p class="rows__to">Book a call</p>

  </div>

</section>

</body>
</html>
