<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your ad campaign is the funnel</title>
<link rel="stylesheet" href="../4pi.css">
<link rel="stylesheet" href="../voice-quiet.css">
</head>
<body>

<section class="slide slide--center slide--mid">

  <h2 class="h3" style="margin-bottom:70px">Your ad campaign <span class="mark">IS</span> the funnel</h2>

  <!-- The same five ads on both sides, drawn with the same dot. The claim is
       that these are one thing in two arrangements, so nothing may differ
       between the halves except the arrangement itself. -->
  <div class="same">

    <div class="nest" style="--nest-w:400px; --nest-pad:26px; --dot:42px; --dot-gap:20px">
      <p class="nest__label">1 CBO campaign</p>
      <div class="nest__inner">
        <p class="nest__label" style="margin-bottom:0">1 control ad set</p>
        <div class="dots" style="--cols:5">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </div>

    <p class="same__eq">=</p>

    <div class="funnel-wrap" style="--fw:420px; --fbh:78px; --fsz:15px">
      <div class="funnel">

        <div class="funnel__band funnel__band--1">
          <div class="dots" style="--cols:3; --dot:34px; --dot-gap:18px; width:max-content; margin:0">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>

        <div class="funnel__band funnel__band--2">
          <div class="dots" style="--cols:1; --dot:34px; width:max-content; margin:0">
            <span class="dot"></span>
          </div>
        </div>

        <div class="funnel__band funnel__band--3">
          <div class="dots" style="--cols:1; --dot:34px; width:max-content; margin:0">
            <span class="dot"></span>
          </div>
        </div>

        <div class="funnel__neck"></div>
      </div>
    </div>

  </div>

</section>

</body>
</html>
